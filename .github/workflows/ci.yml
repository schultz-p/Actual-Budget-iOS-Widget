name: CI

on:
  pull_request:

jobs:
  validate:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check actual-budget-widget.js

      - name: Lint with ESLint
        run: npx eslint actual-budget-widget.js

      - name: Run tests
        run: npm test
