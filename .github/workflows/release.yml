name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check syntax before release
        run: node --check actual-budget-widget.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: actual-budget-widget.js
          generate_release_notes: true
